  - type: Item
    heldPrefix: cotton        

- type: entity
  name: Trashsicle
  parent: FoodFrozenBase
  id: FoodFrozenTrash
  description: Tender piece of delicious trash, frozen on a popsicle... Who thinks of this kind of stuff?
  components:
  - type: Sprite
    sprite: _Moffstation/Objects/Consumable/Food/admeme.rsi
    layers:
    - state: stick
    - state: trash
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: ToxinTrash
          Quantity: 15
  - type: Tag
    tags:
    - Trash
